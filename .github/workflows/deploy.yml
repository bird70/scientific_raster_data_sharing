name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-timeout moto hypothesis xarray zarr rioxarray netcdf4 s3fs
      
      - name: Run unit tests with coverage
        run: |
          cd app
          PYTHONPATH=. pytest tests/unit/ --cov=app --cov-report=xml --cov-report=term
      
      - name: Run integration tests
        run: |
          cd app
          PYTHONPATH=. pytest tests/integration/ -v
        continue-on-error: true
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./app/coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Check if ECR repository exists
        id: check-ecr
        run: |
          if aws ecr describe-repositories --repository-names ${{ secrets.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ ECR repository does not exist. Run terraform apply first."
          fi
      
      - name: Login to Amazon ECR
        if: steps.check-ecr.outputs.exists == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract metadata for Docker
        if: steps.check-ecr.outputs.exists == 'true'
        id: meta
        run: |
          ECR_REPO="${{ secrets.ECR_REPOSITORY }}"
          if [ -z "$ECR_REPO" ]; then
            echo "Error: ECR_REPOSITORY secret is not set"
            exit 1
          fi
          echo "tags=${{ steps.login-ecr.outputs.registry }}/${ECR_REPO}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest=${{ steps.login-ecr.outputs.registry }}/${ECR_REPO}:latest" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        if: steps.check-ecr.outputs.exists == 'true'
        run: |
          docker build -f app/Dockerfile -t ${{ steps.meta.outputs.tags }} -t ${{ steps.meta.outputs.latest }} .
      
      - name: Push Docker image to ECR
        if: steps.check-ecr.outputs.exists == 'true'
        run: |
          docker push ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.latest }}
      
      - name: Skip deployment notice
        if: steps.check-ecr.outputs.exists == 'false'
        run: |
          echo "⚠️ Skipping Docker build - ECR repository not found"
          echo "Run 'terraform apply' to create infrastructure first"

  terraform-docs-security:
    name: Terraform Documentation and Security
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Install terraform-docs
        run: |
          wget https://github.com/terraform-docs/terraform-docs/releases/download/v0.17.0/terraform-docs-v0.17.0-linux-amd64.tar.gz
          tar -xzf terraform-docs-v0.17.0-linux-amd64.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
      
      - name: Generate documentation for root module
        run: |
          cd terraform
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for network module
        run: |
          cd terraform/modules/network
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for IAM module
        run: |
          cd terraform/modules/iam
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for data module
        run: |
          cd terraform/modules/data
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for ECS module
        run: |
          cd terraform/modules/ecs
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for CloudFront module
        run: |
          cd terraform/modules/cloudfront
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for ingestion module
        run: |
          cd terraform/modules/ingestion
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Generate documentation for monitoring module
        run: |
          cd terraform/modules/monitoring
          terraform-docs markdown table --output-file README.md --output-mode inject .
      
      - name: Install checkov
        run: |
          pip install checkov
      
      - name: Run checkov security scan
        run: |
          # Run with soft-fail to not block on all issues
          # Configuration file .checkov.yml will skip non-critical checks
          checkov --directory terraform \
            --framework terraform \
            --config-file terraform/.checkov.yml \
            --output cli \
            --output json \
            --output-file-path . \
            --soft-fail
        continue-on-error: true
      
      - name: Check for critical security issues
        run: |
          # Check if the report file exists
          if [ ! -f "results_json.json" ]; then
            echo "⚠️ Checkov report not found, skipping security check"
            exit 0
          fi
          
          # Count critical and high severity issues
          CRITICAL_COUNT=$(jq -r '[.results.failed_checks[] | select(.severity == "CRITICAL")] | length' results_json.json 2>/dev/null || echo "0")
          HIGH_COUNT=$(jq -r '[.results.failed_checks[] | select(.severity == "HIGH")] | length' results_json.json 2>/dev/null || echo "0")
          TOTAL_CRITICAL=$(($CRITICAL_COUNT + $HIGH_COUNT))
          
          echo "📊 Security Scan Summary:"
          echo "  - Critical severity issues: $CRITICAL_COUNT"
          echo "  - High severity issues: $HIGH_COUNT"
          echo "  - Total critical/high: $TOTAL_CRITICAL"
          
          # Only fail if there are CRITICAL severity issues (not HIGH)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo ""
            echo "❌ CRITICAL severity security issues found!"
            echo "The following critical issues must be addressed:"
            jq -r '.results.failed_checks[] | select(.severity == "CRITICAL") | "  - [\(.check_id)] \(.check_name)"' results_json.json
            exit 1
          fi
          
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo ""
            echo "⚠️  HIGH severity issues found (not blocking deployment):"
            jq -r '.results.failed_checks[] | select(.severity == "HIGH") | "  - [\(.check_id)] \(.check_name)"' results_json.json | head -10
          fi
          
          echo ""
          echo "✅ No critical security issues found - deployment can proceed"
      
      - name: Commit and push documentation changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add terraform/**/README.md || true
          
          if git diff --staged --quiet; then
            echo "✅ No documentation changes to commit"
          else
            echo "📝 Committing documentation changes..."
            git commit -m "docs: update Terraform module documentation [skip ci]"
            
            echo "⬆️ Pushing changes..."
            git push || {
              echo "⚠️ Failed to push documentation changes"
              echo "This is not critical - documentation can be updated manually"
              exit 0
            }
            echo "✅ Documentation updated successfully"
          fi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build, terraform-docs-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Check if ECS services exist
        id: check-services
        run: |
          if aws ecs describe-services --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE_TILES }} --region ${{ env.AWS_REGION }} 2>/dev/null | grep -q ACTIVE; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ ECS services do not exist. Run terraform apply first."
          fi
      
      - name: Login to Amazon ECR
        if: steps.check-services.outputs.exists == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Download tiles service task definition
        if: steps.check-services.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_TILES }} \
            --query taskDefinition > tiles-task-definition.json
      
      - name: Update tiles task definition with new image
        if: steps.check-services.outputs.exists == 'true'
        id: tiles-task-def
        run: |
          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          cat tiles-task-definition.json | \
            jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' > tiles-task-definition-new.json
          echo "task-definition=tiles-task-definition-new.json" >> $GITHUB_OUTPUT
      
      - name: Register new tiles task definition
        if: steps.check-services.outputs.exists == 'true'
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://tiles-task-definition-new.json
      
      - name: Update tiles ECS service
        if: steps.check-services.outputs.exists == 'true'
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE_TILES }} \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_TILES }} \
            --force-new-deployment
      
      - name: Download timeseries service task definition
        if: steps.check-services.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_TIMESERIES }} \
            --query taskDefinition > timeseries-task-definition.json
      
      - name: Update timeseries task definition with new image
        if: steps.check-services.outputs.exists == 'true'
        id: timeseries-task-def
        run: |
          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          cat timeseries-task-definition.json | \
            jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' > timeseries-task-definition-new.json
          echo "task-definition=timeseries-task-definition-new.json" >> $GITHUB_OUTPUT
      
      - name: Register new timeseries task definition
        if: steps.check-services.outputs.exists == 'true'
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://timeseries-task-definition-new.json
      
      - name: Update timeseries ECS service
        if: steps.check-services.outputs.exists == 'true'
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE_TIMESERIES }} \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_TIMESERIES }} \
            --force-new-deployment
      
      - name: Wait for tiles service deployment to stabilize
        if: steps.check-services.outputs.exists == 'true'
        run: |
          echo "Waiting for tiles service deployment..."
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE_TILES }} || {
            echo "⚠️ Service did not stabilize within timeout"
            echo "Checking service status..."
            aws ecs describe-services \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --services ${{ secrets.ECS_SERVICE_TILES }} \
              --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Events:events[0:3]}' \
              --output json
            echo "Note: Deployment may still be in progress. Check AWS Console for details."
            exit 0
          }
        continue-on-error: true
      
      - name: Wait for timeseries service deployment to stabilize
        if: steps.check-services.outputs.exists == 'true'
        run: |
          echo "Waiting for timeseries service deployment..."
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE_TIMESERIES }} || {
            echo "⚠️ Service did not stabilize within timeout"
            echo "Checking service status..."
            aws ecs describe-services \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --services ${{ secrets.ECS_SERVICE_TIMESERIES }} \
              --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Events:events[0:3]}' \
              --output json
            echo "Note: Deployment may still be in progress. Check AWS Console for details."
            exit 0
          }
        continue-on-error: true
      
      - name: Skip deployment notice
        if: steps.check-services.outputs.exists == 'false'
        run: |
          echo "⚠️ Skipping ECS deployment - services not found"
          echo "Run 'terraform apply' to create infrastructure first"

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Wait for service stabilization
        run: sleep 60
      
      - name: Test health endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.ALB_URL }}/health)
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Health check failed with status code: $RESPONSE"
            exit 1
          fi
          echo "✅ Health check passed"
      
      - name: Test API docs endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.ALB_URL }}/docs)
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ API docs failed with status code: $RESPONSE"
            exit 1
          fi
          echo "✅ API docs endpoint passed"
      
      - name: Test collections endpoint (empty is OK)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" ${{ secrets.ALB_URL }}/api/collections)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Collections endpoint failed with status code: $HTTP_CODE"
            exit 1
          fi
          
          if ! echo "$BODY" | jq empty 2>/dev/null; then
            echo "❌ Collections endpoint did not return valid JSON"
            exit 1
          fi
          echo "✅ Collections endpoint passed (returned: $BODY)"
      
      - name: Test metrics endpoint
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" ${{ secrets.ALB_URL }}/metrics)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Metrics endpoint failed with status code: $HTTP_CODE"
            exit 1
          fi
          
          if ! echo "$BODY" | grep -q "^# HELP"; then
            echo "❌ Metrics endpoint did not return Prometheus format"
            exit 1
          fi
          echo "✅ Metrics endpoint passed"
      
      - name: All smoke tests passed
        run: echo "🎉 All smoke tests passed successfully!"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get infrastructure info from AWS
        id: tfoutput
        run: |
          # Get ALB DNS name by name
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "dataplatform-sciraster-alb" --query 'LoadBalancers[0].DNSName' --output text)
          
          # Use known bucket naming pattern from Terraform
          BUCKET="data-platform-scientific-raster-sharing-frontend-dev"
          
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
      
      - name: Build frontend with dynamic API URL
        run: |
          cd frontend
          VITE_API_BASE_URL="http://${{ steps.tfoutput.outputs.alb_dns }}" npm run build
      
      - name: Check S3 bucket permissions
        run: |
          aws s3 ls s3://${{ steps.tfoutput.outputs.bucket }}/ || echo "Bucket access check failed"
      
      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ steps.tfoutput.outputs.bucket }}/ --delete
          echo "✅ Frontend deployed to S3 bucket: ${{ steps.tfoutput.outputs.bucket }}"

  smoke-tests-with-data:
    name: Run Smoke Tests with Data Ingestion
    runs-on: ubuntu-latest
    needs: [smoke-tests, deploy-frontend]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Upload test NetCDF file for ingestion
        run: |
          TEST_FILE="test-$(date +%s).nc"
          aws s3 cp data/your-data.nc s3://${{ secrets.S3_RAW_BUCKET }}/ingestion/$TEST_FILE
          echo "TEST_FILE=$TEST_FILE" >> $GITHUB_ENV
          echo "✅ Test file uploaded: $TEST_FILE"
      
      - name: Wait for ingestion processing
        run: |
          echo "Waiting for Step Functions to process the file..."
          sleep 300
      
      - name: Check Step Functions execution
        run: |
          # Get recent executions
          EXECUTIONS=$(aws stepfunctions list-executions \
            --state-machine-arn ${{ secrets.STEP_FUNCTIONS_ARN }} \
            --max-items 5 \
            --query 'executions[?status==`SUCCEEDED`]' \
            --output json)
          
          if [ "$(echo "$EXECUTIONS" | jq length)" -gt 0 ]; then
            echo "✅ Found successful Step Functions executions"
          else
            echo "⚠️ No successful executions found yet (this may be normal for first run)"
          fi
      
      - name: Test collections endpoint after ingestion
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" ${{ secrets.ALB_URL }}/api/collections)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Collections endpoint failed with status code: $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Collections endpoint response: $BODY"
      
      - name: Test OpenSearch index
        run: |
          # Check if any documents were indexed
          OPENSEARCH_ENDPOINT="${{ secrets.OPENSEARCH_ENDPOINT }}"
          if [ -n "$OPENSEARCH_ENDPOINT" ]; then
            COUNT_RESPONSE=$(curl -s "https://$OPENSEARCH_ENDPOINT/stac/_count" || echo '{"count":0}')
            COUNT=$(echo "$COUNT_RESPONSE" | jq -r '.count // 0')
            echo "OpenSearch document count: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "✅ OpenSearch contains $COUNT documents"
            else
              echo "⚠️ OpenSearch is empty (ingestion may still be processing)"
            fi
          else
            echo "⚠️ OpenSearch endpoint not available"
          fi
        continue-on-error: true
      
      - name: All enhanced smoke tests completed
        run: echo "🎉 Enhanced smoke tests with data ingestion completed!"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, deploy, smoke-tests, smoke-tests-with-data]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get deployment info
        id: deployment-info
        run: |
          # Get ALB DNS name
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "dataplatform-sciraster-alb" --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "Not available")
          
          # Get ECS service status
          TILES_STATUS=$(aws ecs describe-services --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE_TILES }} --query 'services[0].deployments[0].status' --output text 2>/dev/null || echo "Unknown")
          TIMESERIES_STATUS=$(aws ecs describe-services --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE_TIMESERIES }} --query 'services[0].deployments[0].status' --output text 2>/dev/null || echo "Unknown")
          
          # Get running task count
          TILES_RUNNING=$(aws ecs describe-services --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE_TILES }} --query 'services[0].runningCount' --output text 2>/dev/null || echo "0")
          TIMESERIES_RUNNING=$(aws ecs describe-services --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE_TIMESERIES }} --query 'services[0].runningCount' --output text 2>/dev/null || echo "0")
          
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "tiles_status=$TILES_STATUS" >> $GITHUB_OUTPUT
          echo "timeseries_status=$TIMESERIES_STATUS" >> $GITHUB_OUTPUT
          echo "tiles_running=$TILES_RUNNING" >> $GITHUB_OUTPUT
          echo "timeseries_running=$TIMESERIES_RUNNING" >> $GITHUB_OUTPUT
      
      - name: Get ALB domain from AWS
        id: tfoutput
        run: |
          ALB_DOMAIN=$(aws elbv2 describe-load-balancers --names "dataplatform-sciraster-alb" --query 'LoadBalancers[0].DNSName' --output text)
          echo "alb_domain=$ALB_DOMAIN" >> $GITHUB_OUTPUT

      - name: Update ECS service with ALB domain for CORS
        run: |
          echo "ALB domain: ${{ steps.tfoutput.outputs.alb_domain }}"
          echo "Note: CORS is configured in main.py with allow_origins=['*']"
          echo "No ECS service update needed for CORS configuration"
      
      - name: Generate deployment summary
        run: |
          # Determine overall status
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          SMOKE_STATUS="${{ needs.smoke-tests.result }}"
          ENHANCED_SMOKE_STATUS="${{ needs.smoke-tests-with-data.result }}"
          
          if [[ "$BUILD_STATUS" == "success" && "$DEPLOY_STATUS" == "success" && "$SMOKE_STATUS" == "success" && "$ENHANCED_SMOKE_STATUS" == "success" ]]; then
            OVERALL_STATUS="✅ SUCCESS"
            STATUS_EMOJI="🎉"
          elif [[ "$BUILD_STATUS" == "failure" || "$DEPLOY_STATUS" == "failure" ]]; then
            OVERALL_STATUS="❌ FAILED"
            STATUS_EMOJI="💥"
          else
            OVERALL_STATUS="⚠️ PARTIAL"
            STATUS_EMOJI="⚠️"
          fi
          
          # Create summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # $STATUS_EMOJI Scientific Raster Data Platform - Deployment Summary
          
          **Overall Status:** $OVERALL_STATUS
          **Commit:** \`${{ github.sha }}\`
          **Deployed:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ## 🚀 Deployment Status
          
          | Component | Status | Running Tasks |
          |-----------|--------|---------------|
          | Tiles Service | ${{ steps.deployment-info.outputs.tiles_status }} | ${{ steps.deployment-info.outputs.tiles_running }} |
          | Timeseries Service | ${{ steps.deployment-info.outputs.timeseries_status }} | ${{ steps.deployment-info.outputs.timeseries_running }} |
          
          ## 🌐 API Endpoints
          
          **Base URL:** \`http://${{ steps.deployment-info.outputs.alb_dns }}\`
          
          ### Core Endpoints
          - **Health Check:** [/health](http://${{ steps.deployment-info.outputs.alb_dns }}/health)
          - **API Documentation:** [/docs](http://${{ steps.deployment-info.outputs.alb_dns }}/docs)
          - **OpenAPI Spec:** [/openapi.json](http://${{ steps.deployment-info.outputs.alb_dns }}/openapi.json)
          - **Metrics:** [/metrics](http://${{ steps.deployment-info.outputs.alb_dns }}/metrics)
          
          ### Data Access Endpoints
          - **Collections:** \`GET /api/collections\`
          - **Timeseries:** \`GET /api/timeseries?lon={lon}&lat={lat}&start={start}&end={end}&variable={variable}\`
          - **Map Tiles:** \`GET /tiles/{collection}/{z}/{x}/{y}.png\`
          
          ## 📊 Example API Calls
          
          ### Get Available Collections
          \`\`\`bash
          curl "http://${{ steps.deployment-info.outputs.alb_dns }}/api/collections"
          \`\`\`
          
          ### Check API Documentation
          \`\`\`bash
          curl "http://${{ steps.deployment-info.outputs.alb_dns }}/docs"
          \`\`\`
          
          ### Get OpenAPI Specification
          \`\`\`bash
          curl "http://${{ steps.deployment-info.outputs.alb_dns }}/openapi.json"
          \`\`\`
          
          ### Monitor Application Metrics
          \`\`\`bash
          curl "http://${{ steps.deployment-info.outputs.alb_dns }}/metrics"
          \`\`\`
          
          ### Test Data Ingestion (Upload NetCDF)
          \`\`\`bash
          aws s3 cp your-data.nc s3://YOUR_RAW_BUCKET/ingestion/test-file.nc
          \`\`\`
          
          ## 🔧 Pipeline Results
          
          | Stage | Result |
          |-------|--------|
          | Build & Push | $BUILD_STATUS |
          | Deploy | $DEPLOY_STATUS |
          | Smoke Tests | $SMOKE_STATUS |
          | Enhanced Smoke Tests | $ENHANCED_SMOKE_STATUS |
          
          ## 📚 Additional Resources
          
          - **Repository:** [GitHub Repository](https://github.com/${{ github.repository }})
          - **Documentation:** [API Routes Changelog](https://github.com/${{ github.repository }}/blob/main/docs/API_ROUTES_CHANGELOG.md)
          - **Deployment Guide:** [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT_GUIDE.md)
          - **AWS Console:** [ECS Cluster](https://console.aws.amazon.com/ecs/home?region=${{ env.AWS_REGION }}#/clusters/${{ secrets.ECS_CLUSTER }}/services)
          
          ---
          *Generated by GitHub Actions on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF