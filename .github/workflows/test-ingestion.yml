name: Test Ingestion Pipeline

on:
  workflow_dispatch:  # Manual trigger only
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

env:
  AWS_REGION: ap-southeast-2
  PYTHON_VERSION: "3.12"

jobs:
  test-ingestion:
    name: Test Ingestion Modules
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov moto xarray zarr rioxarray
      
      - name: Run ingestion tests
        run: |
          cd app
          PYTHONPATH=. pytest tests/ingestion/ -v -m ingestion --cov=app.ingestion --cov-report=term
      
      - name: Test summary
        if: always()
        run: |
          echo "✅ Ingestion pipeline tests completed"
